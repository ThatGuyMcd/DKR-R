# The return addresses of the text calls inside hud_main_time_trial and hud_finish_position that
# the HUD layout recognises (runtime_hud_layout.cpp): a function plus a byte offset, resolved per
# revision from modding/reference-us-v*/functions.toml. v80 inserted eight bytes into the first
# function, so its stopwatch offsets differ; the finish offsets are the same in both.
schema = 1
header = "hud_layout_code_symbols.hpp"
table = "functions"
hex = "upper"
template = '''#pragma once
#include <array>
#include <cstdint>
namespace dkr::runtime::hud_layout_code_symbols {
struct Symbols {
    std::array<std::uint32_t, 6> stopwatch;
    std::array<std::uint32_t, 3> finish;
};
inline constexpr Symbols symbols77{{{@stopwatch0_77:77@,@stopwatch1_77:77@,@stopwatch2_77:77@,@stopwatch3_77:77@,@stopwatch4_77:77@,@stopwatch5_77:77@}},{{@finish0:77@,@finish1:77@,@finish2:77@}}};
inline constexpr Symbols symbols80{{{@stopwatch0_80:80@,@stopwatch1_80:80@,@stopwatch2_80:80@,@stopwatch3_80:80@,@stopwatch4_80:80@,@stopwatch5_80:80@}},{{@finish0:80@,@finish1:80@,@finish2:80@}}};
inline constexpr const Symbols& for_revision(bool us_v80) { return us_v80 ? symbols80 : symbols77; }
}
'''

