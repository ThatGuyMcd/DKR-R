# Character slots and the settings pointer the legacy mod world reads and
# validates (runtime_legacy_mods.cpp, records_guest.inl). The display list
# symbols it also reads come from display_list_symbols.toml.
schema = 1
header = "legacy_world_symbols.hpp"
table = "sdk"
hex = "upper"
symbols = [
  "gCharacterIdSlots",
  "gSettingsPtr",
]
template = '''#pragma once
#include <cstdint>
namespace dkr::runtime::legacy_world_symbols {
struct Symbols {std::uint32_t character_ids;std::uint32_t settings_pointer;};
inline constexpr Symbols symbols77{@ALL:77@};
inline constexpr Symbols symbols80{@ALL:80@};
inline constexpr const Symbols& for_revision(bool us_v80) { return us_v80 ? symbols80 : symbols77; }
}
'''
