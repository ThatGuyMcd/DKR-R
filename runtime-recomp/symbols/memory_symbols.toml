# The retail memory pool table the guest heap measurements read
# (mods/legacy_memory_safety.h). That header is included from C as well as C++,
# so this one is plain C.
schema = 1
header = "memory_symbols.hpp"
table = "sdk"
hex = "upper"
symbols = [
  "gMemoryPools",
]
template = '''#pragma once
#include <stdint.h>
static inline uint32_t dkr_memory_pools_address(unsigned revision) {
    return revision == 77 ? @gMemoryPools:77@ : @gMemoryPools:80@;
}
'''
