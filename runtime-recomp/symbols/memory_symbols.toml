# The memory pool table the main pool growth reads (custom_tracks_hooks.cpp) and
# the guest heap measurements read (mods/legacy_memory_safety.h). The latter is
# included from C as well as C++, so the address function is plain C and the
# namespace is C++ only.
schema = 1
header = "memory_symbols.hpp"
table = "sdk"
hex = "upper"
symbols = [
  "gMemoryPools",
]
template = '''#pragma once
#include <stdint.h>
static inline uint32_t dkr_memory_pools_address(unsigned revision) {
    return revision == 77 ? @gMemoryPools:77@ : @gMemoryPools:80@;
}
#ifdef __cplusplus
#include <cstdint>
namespace dkr::runtime::memory_symbols {
struct Symbols {std::uint32_t pools;};
inline constexpr Symbols symbols77{@ALL:77@};
inline constexpr Symbols symbols80{@ALL:80@};
inline constexpr const Symbols& for_revision(bool us_v80) { return us_v80 ? symbols80 : symbols77; }
}
#endif
'''
