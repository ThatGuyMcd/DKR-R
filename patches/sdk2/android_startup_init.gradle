// Build-only output relocation. The repository and existing APK outputs stay
// untouched; each startup-fix assembly uses a fresh task-owned directory.
gradle.beforeProject { project ->
    def destination = System.getProperty('dkrStartupBuildRoot')
    if (destination == null || destination.trim().isEmpty()) {
        throw new GradleException('A fresh startup-fix build root is required')
    }
    def relative = project.path == ':' ? 'root' : project.path.substring(1).replace(':', '/')
    project.layout.buildDirectory.set(new File(destination, relative))
}
