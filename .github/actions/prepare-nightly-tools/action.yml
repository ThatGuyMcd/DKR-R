name: Prepare nightly test tools
description: Install checksum-verified CMake/CTest with reproducible random seeds
runs:
  using: composite
  steps:
    - name: Install Unix tools
      if: runner.os != 'Windows'
      shell: bash
      run: |
        python3 -m venv "$RUNNER_TEMP/nightly-tools"
        "$RUNNER_TEMP/nightly-tools/bin/python" -m pip install \
          --require-hashes --only-binary=:all: -r .github/nightly-tools.txt
    - name: Install Windows tools
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        python -m venv "$env:RUNNER_TEMP\nightly-tools"
        & "$env:RUNNER_TEMP\nightly-tools\Scripts\python.exe" -m pip install --require-hashes --only-binary=:all: -r .github/nightly-tools.txt
