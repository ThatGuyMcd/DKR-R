name: Service - online directory
on:
  push:
    branches: [main]
    paths:
      - "services/online-directory/**"
      - "services/library-workflow/**" # the API Worker the gateway slots into
      - "services/test-tools/**"
      - ".github/workflows/services-online-directory.yml"
  pull_request:
    paths:
      - "services/online-directory/**"
      - "services/library-workflow/**"
      - "services/test-tools/**"
      - ".github/workflows/services-online-directory.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  # Composes the directory bundle over the library workflow's staged API
  # Worker and runs it in Miniflare (services/online-directory/README.md).
  online-directory:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Compose tests
        run: python3 -B services/online-directory/tests/build_tests.py
      - name: Compose the bundle
        run: |
          python3 -B services/library-workflow/build.py stage --output "$RUNNER_TEMP/library"
          python3 -B services/online-directory/build.py \
            --api-worker "$RUNNER_TEMP/library/PRIVATE-API/worker-single-file.mjs" --output "$RUNNER_TEMP/bundle"
      - name: Directory runtime checks (Miniflare)
        run: |
          npm ci --prefix services/test-tools --ignore-scripts
          miniflare=services/test-tools/node_modules/miniflare
          node services/online-directory/tests/runtime.cjs "$RUNNER_TEMP/bundle" "$miniflare"
          node services/online-directory/tests/runtime.cjs "$RUNNER_TEMP/bundle" "$miniflare" --running
