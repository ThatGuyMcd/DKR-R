name: Android device compilation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-dependencies # zizmor: ignore[self-repository] -- actionlint 1.7.12 compatibility; checkout uses this workflow revision.
        with:
          profile: android
      - name: Install exact device toolchain
        run: |
          if [[ ! -f "$ANDROID_HOME/ndk/29.0.14206865/source.properties" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;29.0.14206865'
          fi
          mkdir -p build/android-compile
          tee build/android-compile/toolchain.txt < "$ANDROID_HOME/ndk/29.0.14206865/source.properties"
      - name: Configure actual Android sources without ROM payloads
        run: |
          cmake -S runtime-recomp/tests/android_compile -B build/android-compile -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/29.0.14206865/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_shared -DCMAKE_BUILD_TYPE=Release
      - name: Compile adapters and link the production platform subset
        run: cmake --build build/android-compile --target DKRAndroidCompileCheck --parallel 3
      - name: Verify arm64 ELF and 16 KB load alignment
        run: |
          python3 scripts/tests/test_verify_android_compile.py
          python3 scripts/verify_android_compile.py build/android-compile \
            --readelf "$ANDROID_HOME/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
      - name: Preserve compilation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-device-compilation
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/android-compile/toolchain.txt
            build/android-compile/compile_commands.json
            build/android-compile/device-objects.json
            build/android-compile/CMakeFiles/CMakeConfigureLog.yaml
  # The folded runtime for Android: RT64 with the Android stage chain and the
  # stage patches on top, and every first-party game TU (DKRPortGameCore),
  # without ROM-derived payloads. Fold PR-2 merge blocker
  # (docs/fold-in/open-items.md).
  android-folded:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      NDK: ndk/29.0.14206865
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-dependencies # zizmor: ignore[self-repository] -- actionlint 1.7.12 compatibility; checkout uses this workflow revision.
        with:
          profile: android-full
          decomp-symbols: "true"
      - name: Install exact device toolchain
        run: |
          if [[ ! -f "$ANDROID_HOME/$NDK/source.properties" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;29.0.14206865'
          fi
      - name: Build the host file_to_c the Android renderer embeds shaders with
        run: |
          mkdir -p build/android-host-tools
          c++ -std=c++17 -O2 -o build/android-host-tools/file_to_c extern/rt64/src/tools/file_to_c/file_to_c.cpp
      - name: Configure the folded runtime (RT64 on, no generated payload)
        run: |
          cmake -S runtime-recomp -B build/android-folded -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DDKR_RUNTIME_BUILD_GENERATED=OFF -DDKR_RUNTIME_BUILD_RT64=ON \
            -DDKR_ANDROID_SDL2_SOURCE="$GITHUB_WORKSPACE/extern/sdl2" \
            -DDKR_HOST_FILE_TO_C="$GITHUB_WORKSPACE/build/android-host-tools/file_to_c"
      - name: Build RT64, the staged dependency sources and the game TUs
        run: cmake --build build/android-folded --parallel 4
      - name: Preserve failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-folded
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build/android-folded/CMakeFiles/CMakeConfigureLog.yaml
            build/android-folded/compile_commands.json
