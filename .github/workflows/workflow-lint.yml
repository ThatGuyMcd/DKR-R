name: Workflow lint
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  workflow-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install verified lint tools
        shell: bash
        run: |
          tool_dir="$RUNNER_TEMP/workflow-lint"
          mkdir -p "$tool_dir"
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$tool_dir/actionlint.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/zizmorcore/zizmor/releases/download/v1.30.1/zizmor-x86_64-unknown-linux-gnu.tar.gz \
            --output "$tool_dir/zizmor.tar.gz"
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz' >"$tool_dir/checksums.txt"
          echo 'e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a  zizmor.tar.gz' >>"$tool_dir/checksums.txt"
          (cd "$tool_dir" && sha256sum --check checksums.txt)
          tar -xzf "$tool_dir/actionlint.tar.gz" -C "$tool_dir" actionlint
          tar -xzf "$tool_dir/zizmor.tar.gz" -C "$tool_dir" zizmor
          echo "$tool_dir" >>"$GITHUB_PATH"
      - name: Check workflow syntax and expressions
        run: actionlint
      - name: Audit workflow security
        run: zizmor --offline --no-progress .github
