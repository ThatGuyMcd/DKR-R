# Tool configuration only. DKR-R is not a Python package and nothing here is
# installed, so there is no [project] table.

[tool.ruff]
# The floor documented in scripts/README.md.
target-version = "py310"
# Matches ColumnLimit in .clang-format so both languages wrap at the same width.
line-length = 120
# First-party Python is scripts/, runtime-recomp/ (tests and cmake helpers) and
# modding/. patches/ holds byte-pinned layer copies that the fold deletes,
# extern/ is third-party, tools/blender/ is the Track Lab addon with its own
# release cycle, build/ is generated.
extend-exclude = [
    "build",
    "extern",
    "patches",
    "tools/blender",
    # The 1.0.7 source capsule pins this file's bytes as a base (see
    # scripts/check_pinned_bytes.py). Lint and format it after the fold.
    "runtime-recomp/tests/replay_probe/test_generator.py",
]
src = [".", "scripts", "runtime-recomp/tests", "modding"]

[tool.ruff.format]
# ruff 0.17 also formats fenced code in Markdown, and the docs keep aligned
# columns there on purpose. The pattern-guard fixtures are inputs to its tests.
exclude = ["*.md", "tests/fixtures/**"]

[tool.ruff.lint]
# Ratchet further groups in one PR each (B, UP, SIM, PTH, ...).
select = ["E", "F", "W", "I"]

[tool.ruff.lint.isort]
# Closest to the existing import style ("from x import y" sorted among "import z").
force-sort-within-sections = true

[tool.ruff.lint.extend-per-file-ignores]
