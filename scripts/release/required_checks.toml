# Every check a release must have run and passed, on every platform, before
# finalize.py hands it off. finalize.py reads each platform's CTest result
# (ctest --output-junit WORK/<platform>/ctest.xml) and fails unless each entry
# below ran there and passed.
#
# An entry with `pending` is a gate the release needs that the folded tree
# doesn't have yet. finalize.py refuses to finalize while any entry is
# pending, naming them: no release is finalized from this tree until the step
# named in `pending` restores them. Never delete a pending entry to get past
# that; land the fixture and drop `pending`.
#
#   id          a stable name for messages
#   ctest_label every CTest test with this label (at least one must run)
#   ctest_test  one CTest test by name
#   why         what the check proves
#   pending     the fold step that restores it

[[check]]
id = "runtime"
ctest_label = "runtime"
why = "The runtime unit and regression suites."

[[check]]
id = "tooling"
ctest_label = "tooling"
why = "The build, packaging and release tooling tests."

[[check]]
id = "graphics"
ctest_label = "graphics"
why = "The renderer and shader policy tests."

